name: docker-build

# hermes-hosted — InstallHermes.ai container image CI.
# SOP-004 hard rule: images build HERE ONLY (GitHub Actions → GHCR, amd64).
# NEVER build/pull/run this image locally on the Mac mini.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract CalVer version (UTC)
        id: ver
        run: |
          V="$(date -u +%Y.%-m.%-d.%-H%M)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push (amd64 — Fred pulls amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HERMES_BASE_VERSION=v0.22.2

      - name: Verify pushed tags (registry metadata, no pull)
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo "Base: nousresearch/hermes-agent:v0.22.2 (immutable tag; digest recorded on release)"
